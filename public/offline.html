<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>غير متصل — عيادة الجمال</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <style>
    body { font-family: system-ui, "Cairo", "Segoe UI", Tahoma, sans-serif; background: #F8F4EE; color: #2A2520; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .container { text-align: center; max-width: 24rem; }
    h1 { font-size: 1.75rem; margin-bottom: 0.75rem; font-weight: 600; }
    p { color: #6b5a4d; line-height: 1.6; }
    .icon { width: 5rem; height: 5rem; margin: 0 auto 1.5rem; background: linear-gradient(135deg, #c9a17a, #5c4a3d); border-radius: 1rem; display: flex; align-items: center; justify-content: center; }
    .icon::after { content: "✦"; color: white; font-size: 2.5rem; }
    button { margin-top: 1.5rem; padding: 0.6rem 1.5rem; border-radius: 9999px; background: #5c4a3d; color: white; border: 0; cursor: pointer; font-weight: 500; }
    button:hover { background: #4a3a30; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" aria-hidden="true"></div>
    <h1>أنتِ غير متصلة</h1>
    <p>عذرًا، لا يمكن تحميل المحتوى. يبدو أنكِ غير متصلة بالإنترنت. تحققي من اتصالكِ وحاولي مرة أخرى.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
